name: Automatic Social Post Publishing Cron

on:
  schedule:
    # Runs every 5 minutes, 24/7 in the cloud
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  publish-due-posts:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Veltrix Auto-Publisher
        run: |
          response=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST https://veltrix-ai-git-main-projects-f867.vercel.app/api/v1/calendar/cron/publish-due -H "Content-Type: application/json")
          echo "$response"
